    <rect y="12" width="64" height="6" fill="#a855f7"/>
    <rect y="20" width="64" height="4" fill="#ddd6fe"/>
    <rect y="26" width="64" height="8" fill="#7c3aed"/>
    <rect y="36" width="64" height="3" fill="#ddd6fe"/>
    <rect y="41" width="64" height="7" fill="#a855f7"/>
    <rect y="50" width="64" height="6" fill="#6d28d9"/>
