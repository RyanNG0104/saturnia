<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SaturnIA · O olho que conversa</title>
  <meta name="description" content="SaturnIA, um chat de IA com um olho de partículas que acompanha você. Criado por Ryan Moreira." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="SaturnIA, início">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Saturn<em>IA</em></span>
    </a>
    <div class="top__actions">
      <button class="ghost-btn" id="new-chat" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nova conversa</span>
      </button>
    </div>
  </header>

  <section class="stage">
    <canvas id="eye" title="Clique para eu piscar" aria-label="Olho da SaturnIA. Clique para ele piscar." role="img"></canvas>
    <p class="stage__status" aria-hidden="true"><i></i><span id="status">Observando</span></p>
  </section>

  <main class="app" id="app" data-empty="true">

    <section class="intro" id="intro">
      <h1>Olá, eu sou a <em>SaturnIA</em>.</h1>
      <p>Pergunte qualquer coisa. Estou de olho.</p>
      <div class="suggestions" id="suggestions">
        <button type="button">Explique computação quântica como se eu tivesse 10 anos</button>
        <button type="button">Monte um plano de estudos de Python em 4 semanas</button>
        <button type="button">Me ajude a escrever um e-mail profissional</button>
        <button type="button">Quais são as luas de Saturno mais curiosas?</button>
      </div>
    </section>

    <section class="thread" id="thread" aria-live="polite" aria-label="Conversa"></section>
  </main>

  <footer class="dock">
    <form class="composer" id="composer">
      <label class="sr-only" for="input">Mensagem para a SaturnIA</label>
      <textarea id="input" rows="1" maxlength="6000" placeholder="Pergunte à SaturnIA…" autocomplete="off"></textarea>
      <button type="submit" class="send" id="send" aria-label="Enviar mensagem">
        <svg class="icon-send" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
      </button>
    </form>
    <p class="disclaimer">
      A SaturnIA pode cometer erros. Funciona com Llama, via Cloudflare Workers AI · Criada por
      <a href="https://ryanng0104.github.io/portfolio/" target="_blank" rel="noopener">Ryan Moreira</a>
    </p>
  </footer>

  <script src="js/config.js?v=5"></script>
  <script src="js/markdown.js?v=5"></script>
  <script src="js/eye.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
