name = "saturnia"
main = "src/index.js"
compatibility_date = "2025-09-01"

# IA da própria Cloudflare (Workers AI): cota diária gratuita, sem chave de API
[ai]
binding = "AI"

# Banco de dados grátis (Cloudflare D1): usuários, conversas, mensagens e memórias
[[d1_databases]]
binding = "DB"
database_name = "saturnia-db"
database_id = "e8599973-4881-4dcd-a458-24845b1b5597"

[vars]
# Modelo das respostas. Para ver outros: npx wrangler ai models
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Modelo menor, usado só para extrair memórias (economiza a cota grátis)
MEMORY_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"

# Sites que podem conversar com este servidor (separados por vírgula)
ALLOWED_ORIGINS = "https://ryanng0104.github.io,http://localhost:5500,http://127.0.0.1:5500"
